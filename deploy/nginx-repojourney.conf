server {
    listen 8088;
    listen [::]:8088;
    server_name 47.103.169.211 repojourney.zhenyuexin.com;

    root /var/www/repojourney;
    index index.html;

    access_log /var/log/nginx/repojourney.access.log;
    error_log /var/log/nginx/repojourney.error.log;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
